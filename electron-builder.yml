appId: dev.vulpes.app
productName: Vulpes
directories:
  buildResources: resources
  output: release
files:
  - "out/**"
  - "package.json"
  - "Vulpes.ico"
  - "Vulpes.png"
win:
  icon: Vulpes.ico
  artifactName: "${productName}-Setup-${version}.${ext}"
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Vulpes
  installerIcon: Vulpes.ico
  uninstallerIcon: Vulpes.ico
mac:
  icon: Vulpes.png
  category: public.app-category.developer-tools
  artifactName: "${productName}-${version}-${arch}.${ext}"
  target:
    - dmg
    - zip
linux:
  icon: Vulpes.png
  category: Development
  artifactName: "${productName}-${version}-${arch}.${ext}"
  target:
    - AppImage
    - deb
publish:
  provider: github
  releaseType: release
