appId: dev.gitlabdesktop.app
productName: GitLab Desktop
directories:
  buildResources: resources
  output: release
files:
  - "out/**"
  - "package.json"
win:
  target:
    - nsis
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
linux:
  category: Development
  target:
    - AppImage
    - deb
publish:
  provider: github
  releaseType: draft
